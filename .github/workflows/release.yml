name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Manual release from the Actions tab: builds the chosen branch head and
  # creates the tag + release itself (for when a tag can't be pushed directly).
  workflow_dispatch:

permissions:
  contents: write
  # Artifact attestations: signed build provenance for the release assets.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Tag push: the tag. Manual run: the manifest version, set below.
      VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ -z "$VERSION" ]; then
            VERSION="$MANIFEST_VERSION"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
              echo "::error::tag $VERSION already exists; bump the version first"
              exit 1
            fi
          fi
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($VERSION)"
            exit 1
          fi

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build deploys into this staging folder (OBSIDIAN_PLUGIN_DIR, the same
      # hook a local build uses): main.js and manifest.json as built, styles.css
      # packed (scripts/package-css.mjs). What is attested and uploaded below
      # comes from there, so the release ships what a vault install receives.
      - name: Release check
        env:
          OBSIDIAN_PLUGIN_DIR: ${{ runner.temp }}/exo-release
        run: pnpm release:check

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/exo-release/main.js
            ${{ runner.temp }}/exo-release/manifest.json
            ${{ runner.temp }}/exo-release/styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/exo-release
        run: |
          # Asset names are the file names, as before; all three are required.
          ASSETS="$OUT/main.js $OUT/manifest.json $OUT/styles.css"
          # Idempotent: releases are usually cut manually (curated notes) before
          # the tag lands here. If one exists, refresh its assets with this
          # CI-built bundle instead of failing.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists — updating assets"
            gh release upload "$VERSION" $ASSETS --clobber
          else
            # --target creates the tag on this commit when it doesn't exist
            # yet (manual runs); on a tag push it already points here.
            gh release create "$VERSION" $ASSETS --target "$GITHUB_SHA" \
              --title "$(node -p "require('./manifest.json').name") $VERSION" \
              --generate-notes
          fi
